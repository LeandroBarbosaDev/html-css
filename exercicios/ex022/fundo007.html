<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container {
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;
            /* Normalmente todo posicionamento de um box é position = relative */
            position: relative;
            height: 93vh;
            padding: 10px;
            background-color: purple;
        }

        #conteudo {
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;
            /* A regra é o box de fora contém o box interno o interno tem position = absolute*/
            position: absolute;
            height: 200px;
            width: 300px;
            background-color: yellow;
            /* A referencia para posicionamento sempre será o vertice esquerdo superior*/
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
